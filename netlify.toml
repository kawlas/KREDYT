[build]
  command = "npm run build"
  publish = "dist/static"
  functions = "netlify/functions"
  
[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Server-Timing = "cdn;desc=\"Netlify Edge\""

# NOTE: A per-page policy is injected as a <meta> tag by prerender.js (with
# SHA-256 hashes of the inline scripts), so we don't set a global header here —
# a static header cannot carry per-page script hashes.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
